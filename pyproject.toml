[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-first-todo"
version = "1.0.0-dev"
description = "A single-user, local-first to-do management application"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Local-First To-Do Team", email = "dev@example.com"},
]
keywords = ["todo", "task-management", "local-first", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Desktop Environment",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",  # For file uploads
    "python-dateutil>=2.8.0",  # For flexible date parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.88.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "nox>=2023.4.22",
    "coverage[toml]>=7.3.0",
    "httpx>=0.25.0",  # For testing FastAPI
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.88.0",
    "httpx>=0.25.0",
]

lint = [
    "mypy>=1.7.0",
    "ruff>=0.1.6",
]

[project.scripts]
local-first-todo = "local_first_todo.main:main"

[project.urls]
Homepage = "https://github.com/example/local-first-todo"
Repository = "https://github.com/example/local-first-todo"
Issues = "https://github.com/example/local-first-todo/issues"

# Tool configurations
[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert statements in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "7.0"
# Custom reporting is handled by conftest.py
# -s: don't capture stdout (required for custom output)
# --tb=no: tracebacks handled by conftest.py
# -q: quiet mode (let conftest.py handle output)
addopts = "-s --tb=no -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "perf: marks tests as performance tests",
    "fuzz: marks tests as fuzz tests",
    "browser: marks tests that require browser automation",
    "mutation: marks tests for mutation testing",
    "soak: marks tests for soak/endurance testing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov" 